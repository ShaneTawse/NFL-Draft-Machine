<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Mock Draft 2025/2026 Season</title>
    <link rel="stylesheet" href="styles2.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <img src="Assets/logo.png" alt="Top Dog Draft Board" class="logo">
        <h1>Top Dog Draft Board 2025/2026 Season</h1>
    </header>
    
    <nav class="navbar">
        <button class="nav-btn" onclick="window.location.href='/index.html';">Go to Draft</button>
        <button class="nav-btn" onclick="window.location.href='/product.html';">Go to Product Page</button>
        <button class="nav-btn" onclick="window.location.href='/depth-charts.html';">Depth Charts</button>
    </nav>

    <main class="content">
        <!-- League News Section -->
        <section class="league-news">
            <h3>League News</h3>
            <div id="LeagueNews">
                <!-- News items will be dynamically loaded here -->
            </div>
        </section>

        <!-- Rumors Section -->
        <section class="rumors">
            <h2>Rumors</h2>
            <ul id="rumors">
                <!-- Rumors will be dynamically loaded here -->
            </ul>
        </section>

        <!-- Free Agents Section -->
        <section class="freeAgents">
            <h3>Free Agents</h3>
            <div id="freeAgents">
                <!-- Free agents will be dynamically loaded here -->
            </div>
        </section>

        <!-- Signings Section -->
        <section class="signings">
            <h3>Signings</h3>
            <div id="signings">
                <!-- Signings will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Top Dog Draft Board. All Rights Reserved.</p>
    </footer>

    <script src="script-frontpage.js"></script>
</body>
</html>
